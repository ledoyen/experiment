name: Run simulation

# The CSV summary reads the population series by its stable series identifier.

on:
  workflow_dispatch:
    inputs:
      population:
        description: "Initial population"
        required: true
        default: "200"
        type: string
      initial_money:
        description: "Initial money per individual"
        required: true
        default: "100"
        type: string
      money_enabled:
        description: "Money enabled from the start"
        required: true
        default: false
        type: boolean
      mobility:
        description: "Job mobility parameter"
        required: true
        default: "0.2"
        type: string
      price_sensitivity:
        description: "Price sensitivity parameter"
        required: true
        default: "0.15"
        type: string
      productivity_variance:
        description: "Productivity variance parameter"
        required: true
        default: "0.2"
        type: string
      money_introduction_day:
        description: "Day to introduce money; leave empty for no introduction"
        required: false
        default: ""
        type: string
      duration_days:
        description: "Simulation duration in days"
        required: true
        default: "365"
        type: string
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Prepare simulation parameters
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.login == 'ledoyen') }}
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          POPULATION: ${{ inputs.population }}
          INITIAL_MONEY: ${{ inputs.initial_money }}
          MONEY_ENABLED: ${{ inputs.money_enabled }}
          MOBILITY: ${{ inputs.mobility }}
          PRICE_SENSITIVITY: ${{ inputs.price_sensitivity }}
          PRODUCTIVITY_VARIANCE: ${{ inputs.productivity_variance }}
          MONEY_INTRODUCTION_DAY: ${{ inputs.money_introduction_day }}
          DURATION_DAYS: ${{ inputs.duration_days }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            printf '%s' "$ISSUE_BODY" > simulation-parameters.json
            jq -e 'type == "object" and (keys | sort) == ["duration_days","initial_money","mobility","money_enabled","money_introduction_day","population","price_sensitivity","productivity_variance"] and (.population | type == "number" and floor == . and . >= 1) and (.initial_money | type == "number") and (.money_enabled | type == "boolean") and (.mobility | type == "number") and (.price_sensitivity | type == "number") and (.productivity_variance | type == "number") and (.money_introduction_day | type == "number" or . == null) and (.duration_days | type == "number" and floor == . and . >= 0)' simulation-parameters.json >/dev/null
            jq -r '"population=" + (.population|tostring) + "\ninitial_money=" + (.initial_money|tostring) + "\nmoney_enabled=" + (.money_enabled|tostring) + "\nmobility=" + (.mobility|tostring) + "\nprice_sensitivity=" + (.price_sensitivity|tostring) + "\nproductivity_variance=" + (.productivity_variance|tostring) + "\nmoney_introduction_day=" + (if .money_introduction_day == null then "" else (.money_introduction_day|tostring) end) + "\nduration_days=" + (.duration_days|tostring)' simulation-parameters.json >> "$GITHUB_ENV"
          else
            {
              echo "population=$POPULATION"
              echo "initial_money=$INITIAL_MONEY"
              echo "money_enabled=$MONEY_ENABLED"
              echo "mobility=$MOBILITY"
              echo "price_sensitivity=$PRICE_SENSITIVITY"
              echo "productivity_variance=$PRODUCTIVITY_VARIANCE"
              echo "money_introduction_day=$MONEY_INTRODUCTION_DAY"
              echo "duration_days=$DURATION_DAYS"
            } >> "$GITHUB_ENV"
          fi

      - name: Run simulation
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.login == 'ledoyen') }}
        run: |
          npm run simulate -- \
            --population "$population" \
            --initial-money "$initial_money" \
            --money-enabled "$money_enabled" \
            --mobility "$mobility" \
            --price-sensitivity "$price_sensitivity" \
            --productivity-variance "$productivity_variance" \
            --money-introduction-day "$money_introduction_day" \
            --duration-days "$duration_days" \
            --output simulation.csv

      - name: Summarize final physiology
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.login == 'ledoyen') }}
        run: |
          python3 - <<'PY'
          import csv
          with open("simulation-final-agents.csv", newline="") as file:
              rows = list(csv.DictReader(file))
          print(f"Final population: {len(rows)}")
          with open("simulation.csv", newline="") as file:
              lines = [line for line in file if not line.startswith("#")]
              history = list(csv.DictReader(lines))
          population_series = next(row for row in history if row["series_id"] == "population")
          populations = [float(value) for value in list(population_series.values())[3:]]
          first_zero = next((index for index, population in enumerate(populations) if population == 0), None)
          print(f"First zero-population day: {first_zero}")
          if not rows:
              raise SystemExit(0)
          for column in rows[0]:
              if not column.endswith("_reserve"):
                  continue
              values = [float(row[column]) for row in rows]
              print(f"{column}: min={min(values):.6g}, zero={sum(value <= 0 for value in values)}")
          for column in rows[0]:
              if column.endswith("_deficit_days"):
                  values = [float(row[column]) for row in rows]
                  if max(values) > 0:
                      print(f"{column}: max={max(values):.6g}, deficient={sum(value > 0 for value in values)}")
          PY

      - name: Upload simulation CSV
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.login == 'ledoyen') }}
        uses: actions/upload-artifact@v4
        with:
          name: simulation-csv
          path: |
            simulation.csv
            simulation-final-agents.csv
          if-no-files-found: error
